[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overleaf-sync"
version = "0.2.0"
description = "Live two-way sync between an Overleaf project and a local folder, for any editor or coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests", "websocket-client"]

[project.scripts]
overleaf-sync = "overleaf_sync:main"

[project.optional-dependencies]
test = ["pytest"]
e2e = ["selenium"]

[tool.setuptools]
py-modules = ["overleaf_sync", "overleaf_cli"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = ["e2e", ".git"]
